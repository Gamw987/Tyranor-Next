name: Mods Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/game-mods-ui-1.66

permissions:
  contents: read

concurrency:
  group: mods-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: Assemble signed mods debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HIKARINAGI_CLIENT_ID: ${{ vars.HIKARINAGI_CLIENT_ID }}
      NEXTMOE_CLIENT_ID: ${{ vars.NEXTMOE_CLIENT_ID }}
      BANGUMI_CLIENT_ID: ${{ vars.BANGUMI_CLIENT_ID }}
      BANGUMI_CLIENT_SECRET: ${{ secrets.BANGUMI_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          packages=("platforms;android-36" "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.0.13004108")
          for attempt in 1 2 3; do
            if sdkmanager --channel=3 "${packages[@]}"; then
              exit 0
            fi
            echo "::warning::sdkmanager install failed (attempt ${attempt}/3); clearing partial downloads before retry"
            rm -rf "${ANDROID_HOME}/.temp" "${ANDROID_HOME}/.downloadIntermediates" "${ANDROID_HOME}/ndk/28.0.13004108"
            sleep $((attempt * 15))
          done
          echo "::error::Failed to install Android SDK packages after 3 attempts"
          exit 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub secret: ${name}"
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi
          keystore="${RUNNER_TEMP}/tyranor-mods.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          {
            echo "ANDROID_KEYSTORE_FILE=${keystore}"
            echo "ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
            echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
            echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK signing and version
        run: |
          apk="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          if [[ -z "${apk}" ]]; then
            echo "::error::No debug APK found"
            exit 1
          fi
          echo "APK=${apk}"
          "${ANDROID_HOME}/build-tools/37.0.0/apksigner" verify --print-certs "${apk}" | head -n 6
          "${ANDROID_HOME}/build-tools/37.0.0/aapt2" dump badging "${apk}" | grep -E "^package:" | head -n 1

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: tyranor-mods-1.72-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
